name: Verify live site updates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: barford-live-site-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run unit and regression tests
        run: |
          mkdir -p test-results
          set -o pipefail
          node --test tests/*.test.cjs | tee test-results/unit-tests.txt
      - name: Test old-cache recovery and the actual live website
        run: python scripts/test-site-updates.py --live https://highstreetwebco.github.io/barford-golf-society-2027-dev/
      - name: Save browser screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-update-verification
          path: test-results/
          retention-days: 7

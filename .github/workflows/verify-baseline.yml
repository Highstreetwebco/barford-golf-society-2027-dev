name: Verify 2027 member site
on:
  push:
    branches: [main, restart/live-replica, feature/member-accounts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Check isolated 2027 account redirects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python tests/check-auth-redirects.py
      - run: node tests/baseline.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-browser-checks
          path: test-results/
          retention-days: 7

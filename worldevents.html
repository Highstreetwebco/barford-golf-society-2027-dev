<body>

<div class="container">

<h3>Create New Trip Event</h3>

<label>Event Name</label>
<input id="eventName">

<label>Upload Video</label>

Delete Event
</button>

<h3>View Votes</h3>

<label>Select Event</label>
<select id="adminVoteEventSelect" onchange="loadAdminVotes()"></select>

<div id="adminVotesList"></div>

</div>

<div id="eventList"></div>

</div>

<script type="module">
await window.barfordReady;

const supa_URL="https://xspzmthygrajzktydvvj.supabase.co"
const supa_KEY="sb_publishable_xLM39PjQf4XdTVfNHFOzAQ_i4re6w_c"

const createClient = () => window.barford.client;
const supa=createClient(supa_URL,supa_KEY)

queueMicrotask(() => {
loadEvents()
loadDeleteDropdown()
})

async function loadEvents(){

const { data: events, error } = await supa
.from("trip_events")
.select("*")
.order("created_at",{ascending:false})

if(error){
console.error("Supabase error:",error)
return
}

if(!events || events.length===0){
document.getElementById("eventList").innerHTML="<p>No events yet.</p>"
return
}

const container=document.getElementById("eventList")
container.innerHTML=""

for(const ev of events){

const { data: votes, error } = await supa
.from("trip_votes")
.select("*")
.eq("event_id", Number(ev.id))

if(error){
console.error(error)
continue
}

let yes=0
let no=0

votes?.forEach(v=>{
if(v.vote==="yes") yes++
if(v.vote==="no") no++
})

container.innerHTML+=`

<div class="event-card">

<h3>${ev.name}</h3>

${ev.video ? `
<video controls playsinline preload="metadata">
<source src="${ev.video}" type="video/mp4">
Your browser does not support the video tag.
</video>` : ""}

<div class="vote-count">
<span class="yes">👍 Interested: ${yes}</span>
<span class="no">👎 Not Interested: ${no}</span>
</div>

<form onsubmit="submitVote(event,${ev.id})">

<label>Your Name</label>
<input id="name_${ev.id}" required>

<label>Interested?</label>
<select id="vote_${ev.id}" required>
<option value="">Select</option>
<option value="yes">Yes</option>
<option value="no">No</option>
</select>

<button type="submit">Submit Vote</button>

</form>

</div>
`

}

}

async function submitVote(e,eventId){
    e.preventDefault(); const button=e.target.querySelector('button'); button.disabled=true;
    const {error}=await supa.from('trip_votes').insert({event_id:eventId,name:document.getElementById('name_'+eventId).value.trim(),vote:document.getElementById('vote_'+eventId).value});
    button.disabled=false;
    if(error) return alert(error.code==='23505'?'A vote has already been recorded under this name.':error.message);
    await loadEvents();
  }

async function toggleAdmin(){
    const panel=document.getElementById('adminPanel');
    if(panel.style.display==='block') {panel.style.display='none';return;}
    if(!await window.barford.requireAdmin()) return;
    panel.style.display='block'; await loadDeleteDropdown();
  }

async function createTripEvent(){

const name = document.getElementById("eventName").value.trim()
const file = document.getElementById("videoFile").files[0]

if(!name || !file){
alert("Enter name and upload video")
return
}

const fileName = Date.now()+"_"+file.name

// Upload video
const { data:uploadData, error:uploadError } = await supa.storage
.from("trip-videos")
.upload(fileName,file)

if(uploadError){
console.error(uploadError)
alert("Upload failed: "+uploadError.message)
return
}

// Get public URL
const { data:urlData } = supa.storage
.from("trip-videos")
.getPublicUrl(fileName)

const videoUrl = urlData.publicUrl

// Insert event
const { error:insertError } = await supa
.from("trip_events")
.insert([{
name:name,
video:videoUrl
}])

if(insertError){
console.error(insertError)
alert("Database insert failed")
return
}

// Reset form
document.getElementById("eventName").value=""
document.getElementById("videoFile").value=""

alert("Event created!")

loadEvents()

}

/* PASTE NEW CODE BELOW THIS LINE */

async function deleteTripEvent(){

const eventId=document.getElementById("deleteEventSelect").value

if(!eventId){
alert("Select an event first")
return
}

if(!confirm("Delete this event?")) return

await supa
.from("trip_votes")
.delete()
.eq("event_id",eventId)

await supa
.from("trip_events")
.delete()
.eq("id",eventId)

alert("Event deleted")

loadEvents()
loadDeleteDropdown()

}

async function loadDeleteDropdown(){

const {data}=await supa
.from("trip_events")
.select("*")
.order("created_at",{ascending:false})

const select=document.getElementById("deleteEventSelect")
if(!select) return

select.innerHTML="<option value=''>Select Event</option>"

const voteSelect=document.getElementById("adminVoteEventSelect")
if(voteSelect){
voteSelect.innerHTML="<option value=''>Select Event</option>"
}

data?.forEach(ev=>{
select.innerHTML+=`<option value="${ev.id}">${ev.name}</option>`
if(voteSelect){
voteSelect.innerHTML+=`<option value="${ev.id}">${ev.name}</option>`
}
})

}


async function loadAdminVotes(){

const eventId=document.getElementById("adminVoteEventSelect").value
if(!eventId) return

const { data, error } = await supa
.from("trip_votes")
.select("*")
.eq("event_id", Number(eventId))
.order("created_at",{ascending:true})

if(error){
console.error(error)
return
}

const container=document.getElementById("adminVotesList")

if(!data || data.length===0){
container.innerHTML="<p>No votes yet.</p>"
return
}

let html="<table style='width:100%;margin-top:10px'>"
html+="<tr><th>Name</th><th>Vote</th></tr>"

data.forEach(v=>{
html+=`<tr>
<td>${v.name}</td>
<td>${v.vote}</td>
</tr>`
})

html+="</table>"

container.innerHTML=html
}


window.loadEvents = loadEvents;
window.submitVote = submitVote;
window.toggleAdmin = toggleAdmin;
window.createTripEvent = createTripEvent;
window.deleteTripEvent = deleteTripEvent;
window.loadDeleteDropdown = loadDeleteDropdown;
window.loadAdminVotes = loadAdminVotes;
</script>

</body>

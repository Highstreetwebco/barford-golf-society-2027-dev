<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Barford member presentation</title><style>html,body{margin:0;background:#e9eee9;color:#143d31;font-family:Arial,sans-serif}aside{position:absolute;left:24px;top:28px;width:240px}h1{font:32px Georgia,serif}p{font-size:17px;line-height:1.5}button,a{display:block;font:16px Arial;padding:12px;margin:8px 0;border:1px solid #567465;background:white;color:#143d31;text-decoration:none}#phone{position:absolute;left:450px;top:24px;width:430px;height:840px;border:0;background:white}#state{font-size:14px}</style></head><body><aside><h1>Barford 2027</h1><p>Presentation copy. Example members, events and scores.</p><button data-scene="public">Welcome page</button><button data-scene="signup">Create an account</button><button data-scene="booking">Book an event</button><button data-scene="reserve">Reserve list</button><button data-scene="round">Event day</button><button data-scene="halfway">Halfway</button><button data-scene="map">Course map</button><button data-scene="offline">Offline scoring</button><button data-scene="handover">Hand over scoring</button><button data-scene="finish">Finish the round</button><button data-scene="results">Season results</button><button id="savedmap">Saved hole layout</button><button id="connection">Simulate loss of signal</button><p id="state">Example data only</p></aside><iframe id="phone" title="Mobile member website" src="index.html"></iframe><script>const frame=document.getElementById('phone');document.querySelectorAll('[data-scene]').forEach(button=>button.onclick=()=>{for(const key of Object.keys(localStorage))if(key.startsWith('barford-presentation-'))localStorage.removeItem(key);localStorage.setItem('barford-presentation-scenario',button.dataset.scene);const s=button.dataset.scene;frame.src=s==='signup'?'signup.html':s==='results'?'scores.html':['halfway','map','offline','handover','finish'].includes(s)?'scoring.html?capture=4&event=demo-event-spring&card=demo-card-'+s:s==='round'?'event.html?event=demo-event-spring':'index.html';document.getElementById('state').textContent=button.textContent+' · example data';});document.getElementById('savedmap').onclick=()=>{frame.src='saved-hole-v2.html?from=scoring&event=demo-event-spring&card=demo-card-map&hole=10';};document.getElementById('connection').onclick=()=>{const offline=localStorage.getItem('barford-presentation-offline')!=='1';localStorage.setItem('barford-presentation-offline',offline?'1':'0');frame.contentWindow.postMessage({type:'presentation-connection',offline},location.origin);document.getElementById('connection').textContent=offline?'Restore signal':'Simulate loss of signal';};</script></body></html>

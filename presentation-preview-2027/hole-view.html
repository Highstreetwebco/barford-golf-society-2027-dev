<link rel="stylesheet" href="../assets/dist/personal-theme.a32de06727cf.css" data-css-sources="assets/css/personal-theme.css" data-ui-ready data-personal-theme><link rel="preconnect" href="https://xspzmthygrajzktydvvj.supabase.co" crossorigin><style>body .gps-ui button{min-height:48px}body .green-yardages{height:auto!important;flex-wrap:wrap}body #distanceOrigin{width:100%;text-align:center;font-size:14px;line-height:1.3}body .quick-score{font-size:16px;padding:12px 18px}body .hole-card small{font-size:11px}body .green-yardages span{font-size:12px}body .distance-card span{font-size:12px!important}body .gps-back{min-width:48px}body .hole-nav{grid-template-columns:48px 1fr 48px}button:focus-visible{outline:3px solid #e5ae3c;outline-offset:3px}</style><link rel="stylesheet" href="../assets/dist/clubhouse-course.153cb4a54a66.css" data-css-sources="assets/css/clubhouse-course.css"><style>.offline-fallback [hidden]{display:none!important}.offline-fallback:has(.offline-connection-modal[hidden]){z-index:1;padding:190px 18px 90px;background:#073534;backdrop-filter:none;pointer-events:none}</style></head><body class="gps-page clubhouse-course"><div id="courseMap"></div><div class="gps-ui"><div class="distance-stack" aria-live="polite"><div class="distance-card"><b id="toPinDistance">—</b><span>To mapped green</span></div><div class="distance-card target"><b id="toTargetDistance">—</b><span>To your target</span></div><div class="green-yardages"><small id="distanceOrigin">From mapped tee</small><span>Approx. front <b id="frontGreen">—</b></span><span>MID <b id="midGreen">—</b></span><span>Approx. back <b id="backGreen">—</b></span></div></div><div class="gps-top"><button class="gps-back" id="exitGps" aria-label="Back to scorecard">‹</button><div class="hole-card"><div class="hole-number" id="holeNumber">1<small>HOLE</small></div><div class="hole-main"><small>Scorecard length</small><strong id="totalYards">—</strong></div><div class="hole-stat"><small>Par</small><b id="holePar">—</b></div><div class="hole-stat"><small id="teeLabel">Yellow</small><b id="teeYards">—</b></div><div class="hole-stat"><small>Hcp</small><b id="holeSI">—</b></div></div></div><div id="mappingHint" class="mapping-hint hidden">Tap marker position</div><button id="confirmMarker" class="confirm-marker hidden">CONFIRM MARKER</button><button id="quickScore" class="quick-score">Hole 1 · Enter Score</button><div id="setupCard" class="setup-card hidden"><div class="setup-head"><b id="setupTitle">Set out Hole 1</b><button id="closeSetup" class="setup-close">×</button></div><div id="setupStep" class="setup-step">First set the tee marker.</div><div class="setup-actions"><button id="setTee" class="primary">Set tee marker</button><button id="setPin" class="primary hidden">Set hole marker</button><button id="setCorner" class="primary hidden">+ Set corner / dogleg</button><button id="undoMarker">Undo</button><button id="cancelSetup">Cancel</button><button id="saveMarkers" class="save hidden">Confirm hole</button></div></div><div id="holeGrid" class="hole-grid hidden"></div><small id="holeMapAttribution" class="hidden" style="position:fixed;z-index:32;left:50%;bottom:88px;transform:translateX(-50%);padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.66);color:#fff;font:700 10px/1.2 Arial,sans-serif;white-space:nowrap">Hole positions © OpenStreetMap contributors</small><div class="gps-bottom"><button id="mapHole" class="side-button admin-only">SET OUT<br>HOLE</button><div class="hole-nav"><button id="previousHole" aria-label="Previous hole">‹</button><button type="button" class="current-hole" id="holeSelector">Hole <span id="bottomHole">1</span><small>Choose hole 1–18</small></button><button id="nextHole" aria-label="Next hole">›</button></div><button id="recenterMap" class="side-button recenter" type="button">⌖<br>Recentre</button></div></div>
<script src="demo-data.js"></script><script>(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const activeCard = (() => { try { return JSON.parse(localStorage.getItem("barford-presentation-fast-scorecard-v4") || "null"); } catch { return null; } })();
  const redTee=params.get('tee')==='women';
  const scoringReturn=()=>{const q=new URLSearchParams({hole:String(hole),tee:redTee?'women':'men'});if(eventId)q.set('event',eventId);if(params.get('card')||activeCard?.card?.id)q.set('card',params.get('card')||activeCard.card.id);return 'scoring.html?'+q;};
  const eventId = params.get("event") || activeCard?.card?.event_id || null;
  let hole = Math.min(18, Math.max(1, Number(params.get("hole")) || 1));
  let data = null;
  let active = false;

  const readCourse = () => {
    const candidates = [];
    for (let index = 0; index < localStorage.length; index++) {
      const key = localStorage.key(index);
      if (!key?.startsWith("barford-presentation-course-")) continue;
      if (eventId && !key.endsWith(`:${eventId}`)) continue;
      try {
        const value = JSON.parse(localStorage.getItem(key) || "null");
        if (value?.holes?.length) candidates.push(value);
      } catch {}
    }
    return candidates.sort((a, b) => Number(b.savedAt || 0) - Number(a.savedAt || 0))[0] || null;
  };
  const view = () => data?.views?.find(item => Number(item.hole_number) === hole);
  const holeData = () => data?.holes?.find(item => Number(item.hole_number) === hole) || activeCard?.holes?.find(item => Number(item.hole_number) === hole);
  const distance = (a, b, c, d) => {
    const radians = Math.PI / 180;
    const x = (c - a) * radians;
    const y = (d - b) * radians * Math.cos((a + c) * radians / 2);
    return Math.round(Math.sqrt(x * x + y * y) * 6371000 * 1.09361);
  };
  const routeSvg = item => {
    if (!item?.tee_lat || !item?.green_lat) return '<div class="offline-hole-empty">Hole positions have not been mapped yet.</div>';
    const points = [{ lat: Number(item.tee_lat), lng: Number(item.tee_lng) }, ...(item.route_points || []).filter(point => point.type === "corner").map(point => ({ lat: Number(point.lat), lng: Number(point.lng) })), { lat: Number(item.green_lat), lng: Number(item.green_lng) }];
    const minLat = Math.min(...points.map(point => point.lat)), maxLat = Math.max(...points.map(point => point.lat));
    const minLng = Math.min(...points.map(point => point.lng)), maxLng = Math.max(...points.map(point => point.lng));
    const spanLat = Math.max(maxLat - minLat, .00001), spanLng = Math.max(maxLng - minLng, .00001);
    const plotted = points.map(point => `${30 + ((point.lng - minLng) / spanLng) * 240},${300 - ((point.lat - minLat) / spanLat) * 260}`).join(" ");
    const plottedPoints = plotted.split(" "), first = plottedPoints[0].split(","), last = plottedPoints[plottedPoints.length - 1].split(",");
    return `<svg viewBox="0 0 300 330" role="img" aria-label="Saved route for hole ${hole}"><path d="M20 315 Q150 250 280 315 L280 15 Q150 75 20 15 Z" fill="#315c4a" opacity=".28"/><polyline points="${plotted}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${first[0]}" cy="${first[1]}" r="12" fill="#e6c75a" stroke="#fff" stroke-width="4"/><circle cx="${last[0]}" cy="${last[1]}" r="13" fill="#315c4a" stroke="#fff" stroke-width="4"/><text x="${first[0]}" y="${Number(first[1]) - 20}" text-anchor="middle">TEE</text><text x="${last[0]}" y="${Number(last[1]) - 21}" text-anchor="middle">GREEN</text></svg>`;
  };
  const paint = () => {
    const raw=holeData(),mapped=view(),details=redTee?{par:raw?.red_par||raw?.par,yards:raw?.red_yards,stroke_index:raw?.red_stroke_index||raw?.stroke_index,yellow_tee_name:raw?.red_tee_name||"Red"}:raw;
    $("holeNumber").firstChild.nodeValue = String(hole);
    $("bottomHole").textContent = hole;
    $("holePar").textContent = details?.par ?? "—";
    $("teeYards").textContent = details?.yards ?? "—";
    $("teeLabel").textContent = (details?.yellow_tee_name || "Yellow").replace(/^Men\s+/, "");
    $("holeSI").textContent = details?.stroke_index ?? "—";
    const yards = mapped?.tee_lat && mapped?.green_lat ? distance(Number(mapped.tee_lat), Number(mapped.tee_lng), Number(mapped.green_lat), Number(mapped.green_lng)) : null;
    $("totalYards").textContent = details?.yards ? `${details.yards} yds` : "—";
    $("distanceOrigin").textContent=mapped?.tee_lat ? "From mapped tee (saved map)" : "Map distance unavailable";
    $("toPinDistance").textContent = yards ? `${yards} yds` : "—";
    $("toTargetDistance").textContent = "—";
    $("frontGreen").textContent = "—";
    $("midGreen").textContent = yards ? `${yards}y` : "—";
    $("backGreen").textContent = "—";
    $("previousHole").disabled = hole === 1;
    $("nextHole").disabled = hole === 18;
    $("quickScore").textContent = "Back to scorecard";
    const visual = document.querySelector(".offline-hole-visual");
    if (visual) visual.innerHTML = routeSvg(mapped);
  };
  const start = () => {
    if (active || window.__barfordCourseMap || document.querySelector(".offline-fallback")) return;
    active = true;
    data = readCourse() || { holes: activeCard?.holes || [], views: [] };
    const fallback = document.createElement("div");
    fallback.className = "offline-fallback";
    fallback.innerHTML='<div class="offline-connection-modal" role="alert" aria-labelledby="offlineConnectionTitle"><strong id="offlineConnectionTitle">Course map unavailable</strong><p>Your scorecard is still available. Return to scoring to continue your round.</p><button id="offlineBackToScoring" type="button">Back to scorecard</button><button id="showSavedMap" type="button">View saved hole layout</button></div><div class="offline-hole-visual" hidden></div>';
    document.body.prepend(fallback);
    $("previousHole").onclick = () => { if (hole > 1) { hole--; paint(); } };
    $("nextHole").onclick = () => { if (hole < 18) { hole++; paint(); } };
    $("quickScore").onclick = () => location.href = scoringReturn();
    $("offlineBackToScoring").onclick = () => location.href = scoringReturn();
    $("exitGps").onclick = () => location.href = scoringReturn();
    $("recenterMap").disabled = true;
    $('showSavedMap').onclick=()=>{document.querySelector('.offline-connection-modal').hidden=true;document.querySelector('.offline-hole-visual').hidden=false;};
    paint();
  };
  window.addEventListener("barford-presentation-map-ready",()=>{document.querySelector('.offline-fallback')?.remove();active=false;});
  window.addEventListener("barford-presentation-map-failed",start);
  window.addEventListener("offline", () => setTimeout(start, 250));
  setTimeout(() => { if (!window.__barfordCourseMap) start(); }, 5000);
})();
</script><script>(() => {
  "use strict";
  const client = window.BarfordSupabase;
  if (!client) return;
  const fallback = { primary: "#315C4A", accent: "#C7A96B" };
  const valid = value => /^#[0-9a-f]{6}$/i.test(String(value || ""));
  const rgb = value => {
    const hex = value.slice(1);
    return [0, 2, 4].map(index => parseInt(hex.slice(index, index + 2), 16));
  };
  const hex = values => `#${values.map(value => Math.round(Math.max(0, Math.min(255, value))).toString(16).padStart(2, "0")).join("")}`.toUpperCase();
  const mix = (colour, target, amount) => hex(rgb(colour).map((value, index) => value + (rgb(target)[index] - value) * amount));
  const readable = colour => {
    const luminance = value => {
      const channels=rgb(value).map(v=>{const n=v/255;return n<=.04045?n/12.92:((n+.055)/1.055)**2.4;});
      return channels[0]*.2126+channels[1]*.7152+channels[2]*.0722;
    };
    const background=luminance(colour),dark=luminance('#17231D');
    const whiteContrast=1.05/(background+.05);
    const darkContrast=(Math.max(background,dark)+.05)/(Math.min(background,dark)+.05);
    if(Math.max(darkContrast,whiteContrast)<4.5)return '#000000';
    return darkContrast>whiteContrast?'#17231D':'#FFFFFF';
  };
  const contrast = colour => {
    const [maximum, minimum] = [Math.max(...rgb(colour)), Math.min(...rgb(colour))];
    const saturation = maximum ? (maximum - minimum) / maximum : 0;
    const brightness = rgb(colour).reduce((total, value, index) => total + value * [.299, .587, .114][index], 0);
    return { saturation, brightness };
  };
  const apply = (primaryValue, accentValue, persistKey = "") => {
    const primary = valid(primaryValue) ? primaryValue.toUpperCase() : fallback.primary;
    const accent = valid(accentValue) ? accentValue.toUpperCase() : fallback.accent;
    const accentQuality = contrast(accent);
    const action = accentQuality.brightness > 225 || accentQuality.saturation < .12 ? primary : accent;
    const root = document.documentElement;
    const properties = {
      "--member-primary": primary,
      "--member-primary-dark": mix(primary, "#000000", .28),
      "--member-primary-soft": mix(primary, "#FFFFFF", .86),
      "--member-primary-text": readable(primary),
      "--member-accent": accent,
      "--member-accent-dark": mix(accent, "#000000", .22),
      "--member-accent-soft": mix(accent, "#FFFFFF", .82),
      "--member-accent-text": readable(accent),
      "--member-action": action,
      "--member-action-dark": mix(action, "#000000", .24),
      "--member-action-text": readable(action),
      "--green-1000": mix(primary, "#000000", .62),
      "--green-950": mix(primary, "#000000", .48),
      "--green-900": mix(primary, "#000000", .36),
      "--green-800": mix(primary, "#000000", .18),
      "--green-700": primary,
      "--green-100": mix(primary, "#FFFFFF", .82),
      "--green-050": mix(primary, "#FFFFFF", .92),
      "--gold-700": mix(accent, "#000000", .3),
      "--gold-600": mix(accent, "#000000", .16),
      "--gold-500": accent,
      "--gold-400": mix(accent, "#FFFFFF", .18),
      "--gold-100": mix(accent, "#FFFFFF", .8),
      "--brass-soft": `linear-gradient(135deg,${mix(accent, "#000000", .2)} 0%,${accent} 48%,${mix(accent, "#FFFFFF", .25)} 100%)`,
      "--metal-bar": `linear-gradient(180deg,${mix(accent, "#000000", .48)} 0%,${accent} 35%,${mix(accent, "#FFFFFF", .4)} 52%,${mix(accent, "#000000", .22)} 100%)`
    };
    Object.entries(properties).forEach(([name, value]) => root.style.setProperty(name, value));
    root.classList.add("member-personal-theme");
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", primary);
    if (persistKey) localStorage.setItem(persistKey, JSON.stringify({ primary, accent }));
    window.dispatchEvent(new CustomEvent("barford-presentation-theme-applied", { detail: { primary, accent } }));
  };
  window.BarfordPersonalTheme = { apply, valid };

  (async () => {
    const session = (await (window.BarfordInitialSession || client.auth.getSession())).data.session;
    if (!session) return;
    const key = `barford-presentation-personal-theme-${session.user.id}`;
    try {
      const cached = JSON.parse(localStorage.getItem(key) || "null");
      if (cached) apply(cached.primary, cached.accent);
    } catch {}
    const context = window.BarfordMemberContext ? await window.BarfordMemberContext : null;
    const data = window.BarfordMemberContext ? context?.profile : (await client.from("profiles").select("theme_primary,theme_accent").eq("id", session.user.id).maybeSingle()).data;
    if (data) apply(data.theme_primary, data.theme_accent, key);

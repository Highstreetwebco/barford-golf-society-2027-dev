<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Barford mobile video walkthrough</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#f4f0e6;color:#143d31;font-family:Arial,sans-serif}aside{position:absolute;left:24px;top:20px;width:280px}h1{font:30px Georgia,serif}p{font-size:17px;line-height:1.45}button{display:block;width:100%;font:16px Arial;padding:10px;margin:5px 0;border:1px solid #73877b;border-radius:6px;background:white;color:#143d31}.device{position:absolute;left:438px;top:8px;width:454px;height:910px;background:#131616;border:3px solid #454b49;border-radius:44px;box-shadow:0 5px 12px #0004;overflow:hidden}.earpiece{height:28px;display:flex;align-items:center;justify-content:center}.earpiece:before{content:'';width:62px;height:5px;border-radius:8px;background:#555}#phone{display:block;width:430px;height:840px;margin:0 9px;border:0;background:white}.home-indicator{width:115px;height:5px;border-radius:4px;background:#aaa;margin:13px auto}#tap{position:absolute;width:52px;height:52px;border:5px solid #ee202d;border-radius:50%;background:#ff000014;z-index:20;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}#tap.show{animation:tap .85s ease-out}@keyframes tap{0%{opacity:1;scale:.7}65%{opacity:1;scale:1}100%{opacity:0;scale:1.15}}#state{font-size:14px}
</style></head><body><aside><h1>Barford 2027</h1><p>Recording controls<br>Example member data</p>
<button data-scene="public">Welcome and sign-in</button><button data-scene="signup">Account setup</button><button data-scene="booking">Booking journey</button><button data-scene="reserve">Reserve list</button><button data-scene="round">Event-day dashboard</button><button data-scene="halfway">Halfway review</button><button data-scene="offline">Offline and handover</button><button data-scene="finish">Final submission</button><button data-scene="results">Results and personal account</button><button id="switchMember">Switch example member</button><button id="savedMap">Saved hole map</button><button id="connection">Simulate loss of signal</button><button id="clearDemo">Clear presentation examples</button><p id="state">Example data only</p></aside>
<div class="device"><div class="earpiece"></div><iframe id="phone" title="Mobile member website" src="index.html"></iframe><div class="home-indicator"></div><div id="tap"></div></div>
<script>
const frame=document.getElementById('phone'),state=document.getElementById('state');
const clear=()=>{for(const k of Object.keys(localStorage))if(k.startsWith('barford-presentation-'))localStorage.removeItem(k)};
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{clear();localStorage.setItem('barford-presentation-scenario',b.dataset.scene);const s=b.dataset.scene;frame.src=s==='signup'?'signup.html':s==='results'?'scores-v2.html':['halfway','offline','finish'].includes(s)?'scoring.html?event=demo-event-spring&card=demo-card-'+s:'index.html';state.textContent=b.textContent+' · example data';});
document.getElementById('switchMember').onclick=()=>{const next=localStorage.getItem('barford-presentation-actor')==='1'?'0':'1';localStorage.setItem('barford-presentation-actor',next);frame.src='index.html';state.textContent='Example member: '+(next==='1'?'Ben Taylor':'Alex Morgan');};
document.getElementById('savedMap').onclick=()=>{frame.src='saved-hole.html?from=scoring&event=demo-event-spring&card=demo-card-offline&hole=10';};
document.getElementById('connection').onclick=()=>{const offline=localStorage.getItem('barford-presentation-offline')!=='1';localStorage.setItem('barford-presentation-offline',offline?'1':'0');frame.contentWindow.postMessage({type:'presentation-connection',offline},location.origin);state.textContent=offline?'Example connection: offline':'Example connection: online';};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='demo-tap')return;const ring=document.getElementById('tap');ring.style.left=(e.data.x+9)+'px';ring.style.top=(e.data.y+28)+'px';ring.classList.remove('show');void ring.offsetWidth;ring.classList.add('show');});
document.getElementById('clearDemo').onclick=async()=>{await new Promise(r=>{frame.onload=r;frame.src='about:blank'});frame.onload=null;clear();await new Promise((r,j)=>{const q=indexedDB.deleteDatabase('barford-presentation-score-safety');q.onsuccess=r;q.onerror=j});state.textContent='Presentation data removed. '+Object.keys(localStorage).filter(k=>k.startsWith('barford-presentation-')).length+' demonstration keys remain.'};
</script></body></html>

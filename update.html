<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Updating Barford Golf Society</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f2e9;color:#073c2f;font:17px/1.6 system-ui}main{max-width:480px;margin:20px;padding:28px;background:white;border-radius:18px}h1{font-family:Georgia,serif}button,a{font:inherit;color:#073c2f}button{padding:10px 18px;cursor:pointer}small{display:block;margin-top:20px}</style><link rel="stylesheet" href="assets/dist/fairway.6247a9edb681.css" data-css-sources="assets/css/fairway.css">
</head><body><main><h1>Updating your Barford website</h1><p id="status" role="status">Checking the latest website files…</p><small>This refreshes the website only. It does not clear your sign-in or saved scores.</small><button id="retry" type="button" hidden>Try again</button><p><a href="index.html">Return to Barford</a></p></main><script>
(async function repair(){
  const status=document.getElementById('status'),retry=document.getElementById('retry');
  retry.hidden=true;retry.onclick=repair;
  try{
    if(!navigator.onLine)throw Error('Reconnect to the internet, then try again.');
    if('serviceWorker' in navigator){
      const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
      await registration.update();
      const version=worker=>new Promise(resolve=>{
        if(!worker){resolve(null);return;}
        const channel=new MessageChannel();const timer=setTimeout(()=>{channel.port1.close();resolve(null);},800);
        channel.port1.onmessage=event=>{clearTimeout(timer);channel.port1.close();resolve(event.data);};
        worker.postMessage({type:'BARFORD_VERSION'},[channel.port2]);
      });
      let ready=false;
      for(let n=0;n<35;n++){
        const current=await version(navigator.serviceWorker.controller);
        if(current?.policy==='network-first-v1'){ready=true;break;}
        status.textContent='Installing the update. Please keep this page open…';
        await new Promise(resolve=>setTimeout(resolve,800));
      }
      if(!ready)throw Error('The update could not finish. Your saved information is unchanged. Please try again.');
    }
    const check=await fetch('index.html',{cache:'no-store'});
    if(!check.ok||!(await check.text()).includes('id="visitorGateway"'))throw Error('The updated homepage is not available yet. Please try again.');
    status.textContent='Update complete. Opening Barford…';location.replace('index.html');
  }catch(error){status.textContent=error.message;retry.hidden=false;}
})();
</script><script src="assets/dist/design-preview.d95251faced6.js" defer></script></body></html>
